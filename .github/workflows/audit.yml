name: Audit project health

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Audit project repositories
        env:
          PROJECT_AUDIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run audit
